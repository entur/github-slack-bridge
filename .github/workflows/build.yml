name: Build it

on:
  push:
  pull_request:

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

jobs:
  lint:
    uses: entur/gha-docker/.github/workflows/lint.yml@v1

  gradle-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: liberica
          java-version: 25
          cache: gradle

      - name: Build with Gradle
        run: ./gradlew --no-daemon build

      - name: Archive Build Artifacts
        if: success() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: jar-artifact
          path: build/libs
          retention-days: 1
          overwrite: true

  # PRs only: on main, github-slack-bridge-deployment-config builds and scans
  # the image it deploys. Plain build because gha-docker's build.yml requires
  # GCP credentials, which this repo does not have. The artifact layout matches
  # what docker-scan expects (artifact `github-slack-bridge` holding
  # `github-slack-bridge.tar`).
  docker-build:
    if: github.event_name == 'pull_request'
    needs: [gradle-build, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      image_artifact: github-slack-bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: jar-artifact
          path: build/libs
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          tags: github-slack-bridge
          outputs: type=docker,dest=/tmp/github-slack-bridge.tar
          push: false
          provenance: false
          cache-from: type=gha,ignore-error=true
          cache-to: type=gha,mode=max,ignore-error=true
      - uses: actions/upload-artifact@v7
        with:
          name: github-slack-bridge
          path: /tmp/github-slack-bridge.tar
          retention-days: 1

  scan:
    needs: [docker-build]
    uses: entur/gha-security/.github/workflows/docker-scan.yml@v2
    with:
      image_artifact: ${{ needs.docker-build.outputs.image_artifact }}

  # Build, push and deploy happen in entur/github-slack-bridge-deployment-config.
  trigger-deploy:
    if: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && github.repository_owner == 'entur' }}
    needs: [gradle-build, lint]
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: deploy-trigger
    permissions: {}
    steps:
      - env:
          GH_TOKEN: ${{ secrets.DEPLOY_TRIGGER_TOKEN }}
        # REST dispatch with an explicit ref: the token only has Actions access,
        # which `gh workflow run`'s default-branch lookup can't use. A missing
        # run link must not fail the job once the dispatch went through.
        run: |
          out=$(gh api -X POST repos/entur/github-slack-bridge-deployment-config/actions/workflows/deploy.yml/dispatches \
            -f ref=main -f "inputs[sha]=$GITHUB_SHA" -F return_run_details=true)
          url=$(jq -r '.html_url // empty' <<<"$out" 2>/dev/null || true)
          echo "Deploy run: ${url:-https://github.com/entur/github-slack-bridge-deployment-config/actions/workflows/deploy.yml}" | tee -a "$GITHUB_STEP_SUMMARY"
